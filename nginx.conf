server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single page: fall back to index.html for any path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
